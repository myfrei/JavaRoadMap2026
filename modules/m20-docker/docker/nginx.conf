# Балансировка нагрузки по всем инстансам сервиса "app".
#
# При `--scale app=3` Docker DNS отдаёт IP-адреса всех реплик по имени "app".
# Чтобы nginx (OSS) перечитывал DNS в рантайме и раскидывал запросы по репликам,
# используем встроенный резолвер Docker (127.0.0.11) и переменную в proxy_pass.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location / {
        set $backend "http://app:8080";
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
    }
}
