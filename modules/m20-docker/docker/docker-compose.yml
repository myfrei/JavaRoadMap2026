# ─────────────────────────────────────────────────────────────────────────────
# Окружение: приложение в НЕСКОЛЬКИХ инстансах за балансировщиком + Postgres.
#
# Запуск из корня репозитория:
#   docker compose -f modules/m20-docker/docker/docker-compose.yml up --build
#
# Масштабирование приложения до 3 копий (один внешний порт, round-robin):
#   docker compose -f modules/m20-docker/docker/docker-compose.yml up --build --scale app=3
#
# Проверка: curl http://localhost:8080/ — запросы распределяются между инстансами app.
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ../../..                              # корень репозитория
      dockerfile: modules/m20-docker/docker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/appdb
      DB_USER: app
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"        # порт виден только во внутренней сети — наружу публикует балансировщик

  lb:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"     # единственный внешний вход -> балансировка по всем инстансам app
    depends_on:
      - app
