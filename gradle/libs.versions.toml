# Version catalog — централизованные версии зависимостей для код-модулей.
#
# Общие тест-зависимости (JUnit 5) уже подключены ко всем модулям в корневом
# build.gradle.kts. Здесь — версии для МОДУЛЬ-СПЕЦИФИЧНЫХ зависимостей, которые
# подключаются в modules/mNN-*/build.gradle.kts по мере наполнения курса, например:
#
#   dependencies { implementation(libs.jackson.databind) }
#
# Версии — ориентир на 2026 год; правь под актуальные релизы при наполнении модулей.

[versions]
junit = "5.11.4"
jackson = "2.18.2"
springBoot = "3.5.14"
slf4j = "2.0.16"
logback = "1.5.15"
assertj = "3.27.0"
mockito = "5.15.2"
testcontainers = "1.20.4"
grpc = "1.81.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# Spring Boot: версии стартеров управляются BOM-ом (spring-boot-dependencies),
# поэтому у самих стартеров version нет. Подключение в модуле:
#   implementation(platform(libs.spring.boot.bom))
#   implementation(libs.spring.boot.starter.web)
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
awaitility = { module = "org.awaitility:awaitility" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
r2dbc-h2 = { module = "io.r2dbc:r2dbc-h2" }
reactor-test = { module = "io.projectreactor:reactor-test" }
h2 = { module = "com.h2database:h2" }
liquibase-core = { module = "org.liquibase:liquibase-core" }

# gRPC не управляется Spring Boot BOM — версия своя.
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
