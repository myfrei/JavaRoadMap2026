# Version catalog — централизованные версии зависимостей для код-модулей.
#
# Общие тест-зависимости (JUnit 5) уже подключены ко всем модулям в корневом
# build.gradle.kts. Здесь — версии для МОДУЛЬ-СПЕЦИФИЧНЫХ зависимостей, которые
# подключаются в modules/mNN-*/build.gradle.kts по мере наполнения курса, например:
#
#   dependencies { implementation(libs.jackson.databind) }
#
# Версии — ориентир на 2026 год; правь под актуальные релизы при наполнении модулей.

[versions]
junit = "5.11.4"
jackson = "2.18.2"
springBoot = "3.4.1"
slf4j = "2.0.16"
logback = "1.5.15"
assertj = "3.27.0"
mockito = "5.15.2"
testcontainers = "1.20.4"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
