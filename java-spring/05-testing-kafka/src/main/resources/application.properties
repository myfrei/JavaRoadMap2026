# JSON-сериализация событий (статьи 04–05). Тип восстанавливается
# из заголовка __TypeId__, который пишет JsonSerializer, — поэтому один
# консьюмер-конфиг обслуживает разные типы событий.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.javaroadmap.spring.s05*

# Новая группа начинает читать топик с начала — иначе тесты не увидят
# сообщения, отправленные до подписки.
spring.kafka.consumer.auto-offset-reset=earliest
