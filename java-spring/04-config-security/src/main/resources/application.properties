# Типобезопасная конфигурация (статья 01): биндится в AppProperties.
app.name=JavaRoadmap Security Demo
app.features=security,jwt,cors

# Секрет для подписи JWT (HS256, минимум 32 байта). В проде — из переменных
# окружения/vault, НИКОГДА не в репозитории. Здесь учебная in-memory демка.
app.jwt.secret=javaroadmap-2026-demo-secret-key-32b!

hw.motd=Добро пожаловать в домашку модуля 4
