# In-memory H2: живёт, пока жив процесс (DB_CLOSE_DELAY=-1 — не закрывать после последнего соединения).
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Схему создаёт ТОЛЬКО Liquibase; Hibernate лишь сверяет с ней сущности.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Без OSIV: ленивые коллекции живут строго внутри транзакции (см. статью 05).
spring.jpa.open-in-view=false
